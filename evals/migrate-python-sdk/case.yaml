schema_version: "1.0"
name: migrate-python-sdk
tags: [migrate]
runs: 1
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    We run hosted Jev today and now have our own VAKYN open-server on an internal box. This is our
    whole moderation module, `moderate.py`:

    ```python
    import os
    from typesafe_sdk import Choice, Noul, TypeSafeClient

    client = TypeSafeClient(api_key=os.environ["TS_PROD_KEY"], model="jev-1.13.0", timeout=5.0)

    def moderate(review: str):
        r = client.system_one(
            state={"review": review},
            questions={
                "abusive": Noul(instructions="Does state.review insult or threaten a person?"),
                "topic": Choice(instructions="What is state.review mainly about?",
                                criteria={"product": "The item itself", "delivery": "Shipping and packaging",
                                          "seller": "The seller's service", "other": "None of these fits"}),
            },
        )
        return r.nouls["abusive"].noul, r.choices["topic"].choice
    ```

    Please move it to our own server. Write the new version as `moderate.py` in this folder and save
    one request for a sample review ("Box arrived crushed and the seller never answered my emails.")
    as a `.json` file. Tell me what else we need to do before we switch for real.
graders:
  - name: code-saved
    type: file_exists
    path: "moderate.py"
  - name: request-saved
    type: file_exists
    path: "*.json"
  - name: code
    type: llm
    focus:
      source: file
      path: "moderate.py"
    criteria: |
      Judge this Python file, a migration of a hosted-Jev module to the person's own server.
      PASS if all hold:
      - it still uses the official SDK (`typesafe_sdk`, `TypeSafeClient`, `system_one`);
      - the pinned hosted model name `jev-1.13.0` is gone: the model is `jev-latest` or comes from
        configuration (e.g. TYPESAFE_DEFAULT_MODEL or another environment variable);
      - the base URL comes from configuration (TYPESAFE_BASE_URL or another environment variable),
        not a hardcoded hosted URL;
      - no API key literal is written in the file;
      - the questions are kept (abusive noul, topic choice with an escape option).
      FAIL if `jev-1.13.0` is still the model, if a key is written into the file, or if the code
      no longer calls VAKYN's /v1/systemone through the SDK or HTTP.
  - name: advice
    type: llm
    criteria: |
      Judge the final answer to the person.
      PASS if all hold:
      - it says pinned hosted model names do not exist on their server (use jev-latest or the name
        from /v1/models);
      - it says the key changes to one made on their own server (vk_ key, e.g. `vakyn keys create`),
        kept in an environment variable;
      - it recommends running old and new side by side on recorded requests (about 30) and comparing
        agreement before switching, and says agreement is not accuracy (labels decide);
      - it gives a way back (rollback by switching the configuration back);
      - it mentions at least one practical difference such as the 5 s timeout being too short on
        their hardware, limits, or error/retry behavior.
      FAIL if it claims VAKYN answered anything or invents agreement numbers or speeds, or if it
      compares VAKYN's quality or price with hosted Jev.
