schema_version: "1.0"
name: research-python-app
tags: [research]
runs: 1
context:
  add_dirs: [fixtures]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    Our helpdesk worker's code is in the extra working directory you were given (a read-only copy of our
    repo). It uses OpenAI for a few things. Where could VAKYN help in this
    app? Please research it and give me a report I can share with the team.
    Save the report in the current folder.
graders:
  - name: report-file
    type: file_exists
    path: "vakyn-research.md"
  - name: spots
    type: llm
    focus:
      source: file
      path: "vakyn-research.md"
    criteria: |
      Judge the report in vakyn-research.md. The app has three
      decision spots, all in helpdesk/triage.py: the spam check `is_spam` (yes/no, `noul`), routing
      `route_ticket` (pick one of four teams, `choice`), and the urgency rating `rate_urgency` (1 to 5,
      `score`). It has two writing spots: `draft_reply` in helpdesk/replies.py and `weekly_summary` in
      helpdesk/reports.py.

      PASS if all of these hold:
      - all three decision spots are listed as places VAKYN can help, each with its file (line numbers
        welcome) and a fitting question type;
      - `draft_reply` and `weekly_summary` are both marked keep (stay with the chat model), not proposed
        for VAKYN;
      - the spots are ranked, with gain (how often it runs, model, cost or wait time), risk and effort
        for each, and assumed numbers are marked as assumptions;
      - each spot names a next skill (convert for these).

      FAIL if a decision spot is missing, if a writing spot is proposed as a VAKYN decision, if there is
      no ranking, or if it claims VAKYN answered or measured anything.
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
  - name: no-server
    type: tool_used
    tool: Bash
    input_match: "systemone|curl[^|]*https?://|wget "
    min: 0
    max: 0
