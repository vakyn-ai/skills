schema_version: "1.0"
name: convert-triage-prompt
tags: [convert]
runs: 1
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    We run every inbound email to our property management office through this prompt with a
    chat model. Can we move it to VAKYN? Show me what happens to each instruction, and save the
    VAKYN request you would send for the sample email below as `inbox.request.json`. Python is fine
    for any code.

    ```
    You are the inbox assistant for Harbor Lane Property Management.
    1. Classify the email as: maintenance, rent_payment, lease_question, noise_complaint or other.
    2. If it is maintenance, say whether it is an emergency (water leak, no heat, gas smell, no power).
    3. Rate how upset the tenant sounds from 1 to 5.
    4. If the email mentions a payment over $2,000, set needs_manager to true.
    5. If the tenant's lease ends within 60 days, add the tag renewal.
    6. Write a two-sentence acknowledgement to send back to the tenant.
    7. You are friendly and calm.
    8. Output valid JSON only, with keys category, emergency, upset, needs_manager, tags, reply.
    ```

    Sample email: "Hi, water is coming through the ceiling of my bathroom from the flat above and
    it's getting worse. I've put towels down. Please send someone today. - Tom, flat 4B"
graders:
  - name: request-saved
    type: file_exists
    path: "inbox.request.json"
  - name: sort
    type: llm
    criteria: |
      Judge the answer (and the saved inbox.request.json if shown).
      PASS if all hold:
      - every one of the 8 instructions is accounted for (a table or list);
      - 1 becomes a `choice` with an escape option (other) and a description per option;
      - 2 becomes a `noul` (emergency), whether in the same request or a follow-up;
      - 3 becomes a `score` with levels described in words, not bare numbers 1–5;
      - 4 (amount over $2,000) and 5 (lease end within 60 days) go to code, not to VAKYN;
      - 6 (the acknowledgement) and 7 (tone) stay with the chat model;
      - 8 ("output valid JSON only") is dropped, because VAKYN answers are already fields;
      - it says what happens to unsure answers (a person, a review queue or the chat model).
      FAIL if an exact rule (4 or 5) is sent to VAKYN as a question, if the reply is given to VAKYN,
      or if the answer presents made-up VAKYN probabilities as real results.
