schema_version: "1.0"
name: migrate-ai-sdk
tags: [migrate]
runs: 1
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    Our Next.js app decides with the Vercel AI SDK through AI Gateway:

    ```ts
    import { experimental_decide as decide } from "ai";

    export async function isSpam(comment: string) {
      const r = await decide({
        model: "typesafe-ai/jev",
        state: { comment },
        questions: { spam: { type: "boolean", instructions: "Is state.comment spam or an ad?" } },
      });
      return r.answers.spam.probability;
    }
    ```

    How do we point this at our own VAKYN server at http://10.0.4.12:8080? Write the new file as
    `spam.ts` here, plus the environment variables we need in `vakyn.env.example` (no real key).
graders:
  - name: code-saved
    type: file_exists
    path: "spam.ts"
  - name: env-saved
    type: file_exists
    path: "vakyn.env.example"
  - name: env
    type: llm
    focus:
      source: file
      path: "vakyn.env.example"
    criteria: |
      PASS if the file sets VAKYN's own variables: `VAKYN_BASE_URL=http://10.0.4.12:8080` (the
      server root; a trailing /v1 is wrong when the code appends /v1/systemone) and `VAKYN_API_KEY`
      with a placeholder value (no real-looking key), plus a model setting for their own server
      (for example `VAKYN_MODEL`, the name from /v1/models). FAIL if it configures the old SDK
      provider instead (`TYPESAFE_AI_BASE_URL`, `TYPESAFE_AI_API_KEY`, `TYPESAFE_BASE_URL`), or
      contains a real-looking key.
  - name: code
    type: llm
    focus:
      source: file
      path: "spam.ts"
    criteria: |
      PASS if all hold:
      - the file calls VAKYN directly with `fetch`: a POST to `<VAKYN_BASE_URL>/v1/systemone` with the
        key from `VAKYN_API_KEY` as a Bearer token;
      - the spam question is kept, with type `noul` (VAKYN has no `boolean` type) and the same
        instructions;
      - the model comes from configuration (their own server needs the name from /v1/models), not
        the "typesafe-ai/jev" gateway string or `jev-latest`;
      - it checks the HTTP status and returns `answers.spam.noul` (the probability of yes).
      FAIL if it still uses `experimental_decide`, `@ai-sdk/typesafe-ai` or another SDK package for
      the call, or if a key is written into the file.
