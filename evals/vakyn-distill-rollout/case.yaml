schema_version: "1.0"
name: vakyn-distill-rollout
tags: [vakyn-distill]
runs: 1
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
  prompt: |
    Our home-insurance claim intake runs on a LangGraph agent: about 900 claims a month. Last quarter it
    handled 2,600 claims; adjusters confirmed the right outcome on 420 of them. We distilled it into a
    program (Python code, VAKYN questions, one small agent step that pulls the policy record). It works on
    the 40 claims we used while writing it.

    How do we move claims from the agent to the program without risk, and how do we decide later whether
    a new program version should replace the current one? Write the plan as rollout.md in the current
    folder.
graders:
  - name: plan-file
    type: file_exists
    path: "rollout.md"
  - name: stages
    type: llm
    focus:
      source: file
      path: "rollout.md"
    criteria: |
      Judge only this one point; ignore everything else in the file.
      PASS if the plan moves claims in stages (for example shadow or 0%, then a growing share such as
      50%, 75%, 90%, then all), with a check of each batch before the next stage, and the agent stays as
      the fallback for every claim the program escalates or is unsure about.
      FAIL if it switches all claims at once, or removes the agent with no fallback.
  - name: sets
    type: llm
    focus:
      source: file
      path: "rollout.md"
    criteria: |
      Judge only this one point; ignore everything else in the file.
      PASS if the 420 confirmed claims are split into a development set and a reserved (held-out) set
      that is never read case by case while writing or fixing the program, and the plan says the 40
      claims used while writing prove little because the program was fitted to them.
      FAIL if there is no reserved set, or the 40 claims are treated as proof that it works.
  - name: promotion
    type: llm
    focus:
      source: file
      path: "rollout.md"
    criteria: |
      Judge only this one point; ignore everything else in the file.
      PASS if a new program version goes live only when it beats the current one on the development set
      and is not worse on the reserved set (or an equivalent two-set rule), with the evidence kept.
      FAIL if there is no promotion rule or it uses one set only.
  - name: no-invented-numbers
    type: llm
    focus:
      source: file
      path: "rollout.md"
    criteria: |
      Judge only this one point; ignore everything else in the file.
      PASS if every result figure in the plan (accuracy, cost saved, escalation rate achieved) is either
      given by the prompt (2,600, 420, 40, 900) or left as something to measure, a placeholder or a
      target the team sets.
      FAIL if the plan states measured-looking results that the prompt did not give, such as "the program
      is 95% accurate" or "saves $3,000 a month".
